<p align="center"><marquee bgcolor="#FFFF00" scrolldelay="100"
width="450">古今來許多世家，無非積德。天地間第一人品，還是讀書。讀書即未成名，究竟人高品雅。修德不期獲報，自然夢穩心安。為善最樂，讀書便佳 。諸君到此何為，豈徒學問文章，擅一藝微長，便算讀書種子。在我所求亦恕，不過子臣弟友，盡五倫本分，共成名教中人。</marquee></p>
